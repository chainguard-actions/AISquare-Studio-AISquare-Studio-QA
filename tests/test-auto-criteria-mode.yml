name: Test auto-criteria execution mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-fake-key-for-testing'
          staging-url: 'https://example.com'
          execution-mode: 'auto-criteria'
          auto-criteria-fallback: 'true'
          auto-criteria-mode: 'suggest'
          auto-criteria-threshold: '85'
          auto-criteria-approval: 'reaction'
          pr-body: |
            Adds new checkout flow with payment integration.

            Changes:
            - Added PaymentService class
            - Updated CartController
            - New checkout endpoint /api/checkout

      - name: Assert auto-criteria mode ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CRITERIA: ${{ steps.action.outputs.criteria }}
          AUTO_CRITERIA_RESULTS: ${{ steps.action.outputs.auto_criteria_results }}
          ERROR_OUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "criteria: $CRITERIA"
          echo "auto_criteria_results: $AUTO_CRITERIA_RESULTS"
          echo "error: $ERROR_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in auto-criteria mode"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — private repo not accessible or API key invalid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
