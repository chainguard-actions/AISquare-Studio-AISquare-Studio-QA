name: Test basic generate mode
on:
  workflow_dispatch:

jobs:
  test-basic-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run AISquare Studio AutoQA action (generate mode)
        id: autoqa
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-test-fake-key-for-testing-only'
          staging-url: 'https://example.com'
          execution-mode: 'generate'
          staging-email: 'test@example.com'
          staging-password: 'password123'
          create-pr: 'false'

      - name: Assert action ran (success or expected failure)
        env:
          OUTCOME: ${{ steps.autoqa.outcome }}
          ERROR_OUT: ${{ steps.autoqa.outputs.error }}
          TEST_GENERATED: ${{ steps.autoqa.outputs.test_generated }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error output: $ERROR_OUT"
          echo "test_generated: $TEST_GENERATED"
          # The action may fail because:
          # 1. The private repo checkout fails (no access)
          # 2. The OpenAI key is invalid
          # Either way, the action should have run (not be skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          # If the action succeeded, test_generated should be set
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$TEST_GENERATED" ]; then
              echo "WARN: test_generated output is empty on success"
            fi
          else
            echo "Action failed as expected (private repo or invalid API key)"
          fi
          echo "PASS: action ran and produced expected outcome"
