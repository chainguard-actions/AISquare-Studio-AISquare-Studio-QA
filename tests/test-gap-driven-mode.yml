name: Test gap-driven execution mode
on:
  workflow_dispatch:

jobs:
  test-gap-driven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run AISquare Studio AutoQA action (gap-driven mode)
        id: autoqa
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-test-fake-key-for-testing-only'
          staging-url: 'https://example.com'
          execution-mode: 'gap-driven'
          test-directory: 'tests/autoqa'
          create-pr: 'false'

      - name: Assert action ran in gap-driven mode
        env:
          OUTCOME: ${{ steps.autoqa.outcome }}
          TEST_GENERATED: ${{ steps.autoqa.outputs.test_generated }}
          TEST_FILE_PATH: ${{ steps.autoqa.outputs.test_file_path }}
          GENERATION_METADATA: ${{ steps.autoqa.outputs.generation_metadata }}
          ERROR_OUT: ${{ steps.autoqa.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "test_generated: $TEST_GENERATED"
          echo "test_file_path: $TEST_FILE_PATH"
          echo "generation_metadata: $GENERATION_METADATA"
          echo "error: $ERROR_OUT"
          # The action should not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          # If action succeeded, verify outputs
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in gap-driven mode"
            if [ "$TEST_GENERATED" = "true" ]; then
              echo "Test was generated: $TEST_FILE_PATH"
              if [ -z "$TEST_FILE_PATH" ]; then
                echo "FAIL: test_generated is true but test_file_path is empty"
                exit 1
              fi
            fi
          else
            echo "Action failed (expected: private repo or invalid API key)"
          fi
          echo "PASS: action ran and produced expected outcome for gap-driven mode"
