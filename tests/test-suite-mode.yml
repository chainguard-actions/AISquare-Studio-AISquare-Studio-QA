name: Test suite execution mode (run all tests)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-fake-key-for-testing'
          staging-url: 'https://example.com'
          staging-email: 'suite@example.com'
          staging-password: 'suitepass'
          execution-mode: 'suite'
          test-directory: 'tests/autoqa'
          git-user-name: 'Test Bot'
          git-user-email: 'testbot@example.com'

      - name: Assert suite mode ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TEST_RESULTS: ${{ steps.action.outputs.test_results }}
          TESTS_FAILED: ${{ steps.action.outputs.tests_failed }}
          ERROR_OUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "test_results: $TEST_RESULTS"
          echo "tests_failed: $TESTS_FAILED"
          echo "error: $ERROR_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in suite mode"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — private repo not accessible or API key invalid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
