name: Test suite execution mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: "sk-test-fake-key-for-testing-only"
          staging-url: "https://example.com"
          staging-email: "suite-test@example.com"
          staging-password: "suite-password"
          execution-mode: "suite"
          test-directory: "tests/autoqa"
          create-pr: "false"

      - name: Assert suite mode action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TEST_RESULTS: ${{ steps.action.outputs.test_results }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "test_results output: $TEST_RESULTS"
          # The action should produce a defined outcome (success or failure)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in suite mode and produced a defined outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
