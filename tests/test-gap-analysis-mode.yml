name: Test gap-analysis execution mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-fake-key-for-testing'
          staging-url: 'https://example.com'
          execution-mode: 'gap-analysis'
          gap-analysis-scope: 'full'
          test-directory: 'tests/autoqa'

      - name: Assert gap-analysis mode ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GAP_RESULTS: ${{ steps.action.outputs.gap_analysis_results }}
          DASHBOARD: ${{ steps.action.outputs.dashboard_results }}
          ERROR_OUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gap_analysis_results: $GAP_RESULTS"
          echo "dashboard_results: $DASHBOARD"
          echo "error: $ERROR_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in gap-analysis mode"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — private repo not accessible or API key invalid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
