name: Test generate execution mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: "sk-test-fake-key-for-testing-only"
          staging-url: "https://example.com"
          execution-mode: "generate"
          test-directory: "tests/autoqa"
          git-user-name: "Test Bot"
          git-user-email: "test@example.com"
          create-pr: "false"

      - name: Assert action outcome is defined
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUT: ${{ steps.action.outputs.error }}
          TEST_GENERATED: ${{ steps.action.outputs.test_generated }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "error output: $ERROR_OUT"
          echo "test_generated output: $TEST_GENERATED"
          # The action should produce a defined outcome (success or failure)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a defined outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
