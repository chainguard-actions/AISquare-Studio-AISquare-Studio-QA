name: Test basic usage - generate mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-test-fake-key-for-testing'
          staging-url: 'https://example.com'
          staging-password: 'test-password-123'
          staging-email: 'test@example.com'
          execution-mode: 'generate'
          create-pr: 'false'
          git-user-name: 'Test Bot'
          git-user-email: 'test@example.com'
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because the private AutoQA repo
          # is not accessible in test environments. We verify it at least
          # started (outcome is 'failure' or 'success', not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it should have at least attempted to run"
            exit 1
          fi
          echo "PASS: action ran with required inputs (outcome=$OUTCOME)"
