name: Test suite execution mode
on:
  workflow_dispatch:

jobs:
  test-suite-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run AISquare Studio AutoQA action (suite mode)
        id: autoqa
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-test-fake-key-for-testing-only'
          staging-url: 'https://example.com'
          execution-mode: 'suite'
          test-directory: 'tests/autoqa'
          staging-email: 'test@example.com'
          staging-password: 'password123'
          create-pr: 'false'

      - name: Assert action ran in suite mode
        env:
          OUTCOME: ${{ steps.autoqa.outcome }}
          TEST_RESULTS: ${{ steps.autoqa.outputs.test_results }}
          TESTS_FAILED: ${{ steps.autoqa.outputs.tests_failed }}
          ERROR_OUT: ${{ steps.autoqa.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "test_results: $TEST_RESULTS"
          echo "tests_failed: $TESTS_FAILED"
          echo "error: $ERROR_OUT"
          # The action should not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          # If action succeeded, test_results should be populated
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in suite mode"
            if [ -z "$TEST_RESULTS" ]; then
              echo "WARN: test_results is empty on success"
            else
              echo "test_results is populated"
            fi
          else
            echo "Action failed (expected: private repo or invalid API key)"
          fi
          echo "PASS: action ran and produced expected outcome for suite mode"
