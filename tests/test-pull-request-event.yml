name: Test pull request event with AutoQA metadata
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: "sk-test-fake-key-for-testing-only"
          staging-url: "https://staging.example.com"
          staging-email: "pr-test@example.com"
          staging-password: "pr-password"
          execution-mode: "generate"
          create-pr: "false"
          pr-body: |
            This PR adds user login functionality.

            ```autoqa
            flow_name: user_login
            tier: A
            area: auth
            ```

      - name: Assert PR event action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FLOW_NAME: ${{ steps.action.outputs.flow_name }}
          TIER: ${{ steps.action.outputs.tier }}
          AREA: ${{ steps.action.outputs.area }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "flow_name output: $FLOW_NAME"
          echo "tier output: $TIER"
          echo "area output: $AREA"
          # The action should produce a defined outcome (success or failure)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran for PR event and produced a defined outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
