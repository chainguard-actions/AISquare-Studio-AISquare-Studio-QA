name: Test suite execution mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openai-api-key: 'sk-fake-key-for-testing'
          staging-url: 'https://staging.example.com'
          staging-email: 'suite-test@example.com'
          staging-password: 'suitepass456'
          execution-mode: 'suite'
          test-directory: 'tests/autoqa'
          create-pr: 'false'
          git-user-name: 'AutoQA Bot'
          git-user-email: 'autoqa@example.com'

      - name: Assert action ran in suite mode (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TEST_RESULTS: ${{ steps.action.outputs.test_results }}
          ERROR_OUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "test_results: $TEST_RESULTS"
          echo "error: $ERROR_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in suite mode"
            echo "PASS: suite mode ran without fatal error"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in suite mode (expected without real credentials or private repo access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
